<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>社工師國考｜110–115 歷屆真題備考</title>
<style>
:root{--a:#2f6f5e;--bg:#f5f7f6;--line:#dfe7e3;--ink:#24312d;--muted:#71807a;--soft:#e8f2ee;--ok:#eaf7ef;--bad:#fff0f1;--warn:#fff7df}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif}.wrap{max-width:980px;margin:auto;padding:18px}.hero h1{margin:6px 0}.muted{color:var(--muted);font-size:13px;line-height:1.7}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}@media(max-width:700px){.grid{grid-template-columns:1fr}}label{display:block;color:var(--muted);font-size:13px;margin:0 0 6px}select,input{width:100%;padding:12px;border:1px solid #cfdad5;border-radius:10px;background:#fff;font:inherit}button{font:inherit;padding:11px 15px;border:0;border-radius:10px;background:var(--a);color:#fff;font-weight:700;cursor:pointer}.secondary{background:#eef3f0;color:var(--ink);border:1px solid var(--line)}.danger{background:#fff0f1;color:#9b3030;border:1px solid #ecc}.uncertain{background:var(--warn);color:#725800;border:1px solid #e7d28a}.uncertain.on{background:#725800;color:#fff}.hidden{display:none}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.status{padding:12px;border-radius:12px}.ok{background:var(--ok);border:1px solid #cfe4d8}.warn{background:var(--warn);border:1px solid #eedcae}.bar{height:8px;background:#e8efec;border-radius:9px;overflow:hidden;margin:12px 0}.bar>div{height:100%;background:var(--a);width:0}.option{display:block;width:100%;text-align:left;background:#fff;color:var(--ink);border:1px solid var(--line);margin:9px 0;padding:15px;border-radius:12px}.option:hover{border-color:var(--a)}.option.sel{border-color:var(--a);background:var(--soft)}.option.correct{background:var(--ok);border-color:#77b78c}.option.wrong{background:var(--bad);border-color:#e17b83}.feedback{padding:14px;border-radius:12px;margin-top:12px;line-height:1.8}.feedback.ok{border-left:5px solid #61a878}.feedback.bad{border-left:5px solid #d45b65}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}@media(max-width:700px){.stats{grid-template-columns:1fr 1fr}}.stat{background:#f7faf8;padding:14px;border-radius:12px}.stat b{display:block;font-size:24px}.wrong{border:1px solid #e3dddd;border-radius:14px;padding:15px;margin:10px 0}.explain{background:#f8faf9;border-left:4px solid var(--a);padding:12px;margin-top:10px;line-height:1.8;white-space:pre-wrap}.tag{display:inline-block;padding:4px 8px;border-radius:999px;background:var(--soft);color:var(--a);font-size:12px;margin:2px}.keywordbar{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.keywordbar input{flex:1;min-width:220px}.keywordbtn{background:#eef3f0;color:var(--ink);border:1px solid var(--line);padding:8px 11px;border-radius:999px;font-size:13px}.keywordHero{background:var(--soft);border-radius:14px;padding:16px}.section{border-top:1px solid var(--line);padding:14px 0}.mode{border:2px solid var(--line);border-radius:14px;padding:15px;cursor:pointer}.mode.active{border-color:var(--a);background:var(--soft)}.mode h3{margin:0 0 5px}.modegrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:700px){.modegrid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
<div class="hero"><h1>社工師國考｜110–115 歷屆真題備考</h1><div class="muted">📱手機／💻電腦皆可｜通勤零碎時間也能刷｜有完整時間可做整份模擬考</div></div>
<div id="status" class="card status warn">正在載入正式題庫……</div>
<section id="home" class="card hidden">
<h2>開始複習</h2>
<div class="modegrid">
<div id="modeFast" class="mode active" onclick="setMode('fast')"><h3>⚡ 快問快答</h3><div class="muted">選完立即知道對錯、答案與解析，適合通勤與零碎時間。</div></div>
<div id="modeExam" class="mode" onclick="setMode('exam')"><h3>📝 模擬考</h3><div class="muted">作答中不揭露答案，最後一題才可交卷，適合完整應試訓練。</div></div>
</div>
<div class="grid" style="margin-top:14px">
<div><label>年度</label><select id="year"><option value="all">全部年度</option><option>115</option><option>114</option><option>113</option><option>112</option><option>111</option><option>110</option></select></div>
<div><label>科目</label><select id="subject"><option value="all">全部五科</option><option>社會工作</option><option>社會工作直接服務</option><option>社會政策與社會立法</option><option>人類行為與社會環境</option><option>社會工作研究方法</option></select></div>
<div><label>題數</label><select id="count"><option>10</option><option>20</option><option>30</option><option>40</option><option value="full">完整考一遍</option></select></div>
</div>
<p id="pool" class="muted"></p>
<div class="actions"><button onclick="startQuiz()">開始</button><button class="secondary" onclick="showWeak()">🎯 個人加強區</button><button class="secondary" onclick="showStats()">📊 成績統計</button></div>
<p class="muted">答案判定以考選部「測驗式試題標準答案」為準；題目與原始解析來自社工日常。若官方公布更正答案，系統會在下一次建置時更新。</p>
</section>
<section id="quiz" class="card hidden"><div><b id="qno"></b><span id="timer" class="muted"></span></div><div class="bar"><div id="prog"></div></div><h2 id="qtext"></h2><div id="opts"></div><div id="feedback"></div><div class="actions" id="nav"></div></section>
<section id="result" class="card hidden"></section>
<section id="review" class="card hidden"></section>
<section id="keywordPage" class="card hidden"><div class="actions"><button class="secondary" onclick="closeKeyword()">← 返回</button><button class="secondary" onclick="goHome()">回首頁</button></div><div class="keywordbar"><input id="keywordSearch" placeholder="搜尋關鍵名詞，例如：創傷知情、生態系統、同理" oninput="searchKeywords()"><button onclick="searchKeywords()">🔎 搜尋</button></div><div id="keywordResults"></div></section>
</div>
<script>
let BANK=[],quiz=[],cur=0,answers={},uncertain={},lastWrong=[],lastUncertain=[],startedAt=0,timerId=null,mode='fast';
const $=id=>document.getElementById(id);const ABCD=['A','B','C','D'];
const G={
'創傷知情':{a:['創傷知情照護','trauma-informed'],s:'以創傷可能普遍存在及其影響為前提，把安全、信任、選擇、自主與合作融入服務，並避免再度受創。',p:['4R：理解 Realize、辨認 Recognize、回應 Respond、防止再度受創 Resist re-traumatization','重視安全、信任、選擇與自主','檢視服務系統是否可能造成再度受創'],e:'看到「創傷知情」先想到 4R。',r:['復原力','賦權','同理','專業關係']},
'人在情境中':{a:['person-in-environment','PIE'],s:'理解個人時，同時把家庭、組織、社區、文化與社會環境納入評估。',p:['個人與環境彼此影響','避免只把問題歸因於個人','可連結生態系統觀點'],e:'看到「個人＋環境脈絡」→ 人在情境中。',r:['生態系統觀點','社會支持']},
'生態系統觀點':{a:['生態觀點'],s:'把人放在多層次環境中理解，關注人與家庭、組織、社區及社會系統的互動。',p:['多層次系統互相影響','重視人與環境的適配','介入可同時處理個人與環境'],e:'看到「系統、環境、互動、脈絡」→ 生態系統觀點。',r:['人在情境中','家庭系統','社會支持']},
'同理':{a:['同理心','empathy'],s:'理解服務對象的主觀經驗與感受，並以對方能理解的方式回應，不等於認同所有行為。',p:['理解感受與觀點','不等於同意','可用反映與澄清確認理解'],e:'看到「站在對方角度、理解感受」→ 同理。',r:['接納','專業關係']},
'接納':{a:['acceptance'],s:'以尊重與非評判態度面對服務對象，承認其作為人的價值與差異。',p:['不因差異否定人的價值','不等於同意或放任','仍須維持專業界線'],e:'看到「不批判、尊重個別性」→ 接納。',r:['同理','專業關係']},
'專業關係':{a:['professional relationship'],s:'社工與服務對象為達成助人目標而建立的有目的關係，兼顧信任、角色與專業界線。',p:['有目的性與專業性','需要適當界線','關係本身可成為介入媒介'],e:'看到「界線、角色、目的、信任」→ 專業關係。',r:['同理','接納','反移情']},
'賦權':{a:['empowerment'],s:'強化服務對象的選擇權、掌控感與行動能力，增加參與自身生活決定的能力。',p:['重視能力與資源','增加選擇與參與','避免社工取代個案決定'],e:'看到「自主、選擇、參與、權力」→ 賦權。',r:['優勢觀點','倡導']},
'優勢觀點':{a:['strengths perspective'],s:'從能力、資源、韌性與可能性出發，而不只聚焦問題與缺陷。',p:['找優勢與資源','看見改變可能','問題仍需評估，但不是唯一焦點'],e:'看到「能力、資源、韌性」→ 優勢觀點。',r:['賦權','復原力']},
'反移情':{a:['countertransference'],s:'助人者因自身經驗、情感或需要而對服務對象產生反應，可能影響專業判斷。',p:['需要自我覺察','可透過督導與反思處理','區分個案反應與自己的情緒'],e:'看到「社工自身情緒被個案勾起」→ 反移情。',r:['移情','督導']},
'危機介入':{a:['crisis intervention'],s:'針對重大事件或壓力造成的急性失衡，先恢復安全、穩定與基本功能，再處理後續問題。',p:['重視當下與安全','聚焦近期事件與可行因應','通常短期、具體、目標導向'],e:'看到「急性失衡、安全、立即處理」→ 危機介入。',r:['安全計畫','支持']},
'社會支持':{a:['social support'],s:'來自家庭、朋友、同儕、社區或正式服務系統的情緒、資訊、工具與實質支持。',p:['可分正式與非正式','支持網絡影響適應與復原','可作為評估與介入資源'],e:'看到「支持網絡、資源、人際連結」→ 社會支持。',r:['復原力','社區']},
'復原力':{a:['韌性','resilience'],s:'個人、家庭或系統面對逆境後維持、恢復或發展適應能力的動態歷程。',p:['不是固定不變的特質','保護因子與支持環境重要','可在關係與資源中培養'],e:'看到「逆境、適應、恢復、保護因子」→ 復原力。',r:['創傷知情','優勢觀點']},
'信度':{a:['reliability'],s:'測量結果的一致性或穩定程度。',p:['重測信度','內部一致性','評分者間信度'],e:'看到「一致、穩定、重複測量」→ 信度。',r:['效度','測量']},
'效度':{a:['validity'],s:'測量工具是否真正測到它聲稱要測量的概念。',p:['內容效度','效標關聯效度','建構效度'],e:'看到「是否真的測到想測的東西」→ 效度。',r:['信度','測量']}
};
function load(k,d){try{return JSON.parse(localStorage.getItem('sw_'+k)||'null')??d}catch{return d}}function save(k,v){localStorage.setItem('sw_'+k,JSON.stringify(v))}
function esc(s){return String(s??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#39;')}
function filter(){const y=$('year').value,s=$('subject').value;return BANK.filter(x=>(y==='all'||String(x.year)===y)&&(s==='all'||x.subject===s))}
function updatePool(){$('pool').textContent=`目前篩選：${filter().length.toLocaleString()} 題｜答案以考選部標準答案為準｜完整考一遍＝此篩選條件全部題目`}
$('year').onchange=$('subject').onchange=updatePool;
function setMode(m){mode=m;$('modeFast').classList.toggle('active',m==='fast');$('modeExam').classList.toggle('active',m==='exam')}
async function init(){try{const r=await fetch('data/bank.json?v='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('not-ready');const d=await r.json();BANK=d.questions||[];const m=d.meta||{};if(BANK.length<1||BANK.some(x=>!x.id||!x.question||!Array.isArray(x.choices)||x.choices.length!==4||x.answer<0||x.answer>3))throw Error('malformed');const verified=BANK.filter(x=>x.answer_verified).length;const papers=m.papers_ok||0;$('status').className='card status ok';$('status').innerHTML=`<b>✓ 題庫已載入</b><br>目前可用 <b>${BANK.length.toLocaleString()}</b> 題｜${papers} 份試卷<br><span class="muted">答案以考選部標準答案為準｜已完成官方驗證 ${verified.toLocaleString()} 題｜題庫會自動檢查更新</span>`;$('home').classList.remove('hidden');updatePool()}catch(e){$('status').className='card status warn';$('status').innerHTML='<b>題庫暫時無法載入</b><br>請重新整理頁面；若仍無法載入，請檢查 GitHub Pages 是否已完成最新部署。'}}
function startQuiz(){const p=filter();if(!p.length)return alert('沒有符合條件的題目');const n=$('count').value==='full'?p.length:Number($('count').value);quiz=[...p].sort(()=>Math.random()-.5).slice(0,Math.min(n,p.length));cur=0;answers={};uncertain={};lastWrong=[];lastUncertain=[];startedAt=Date.now();clearInterval(timerId);timerId=setInterval(updateTimer,1000);$('home').classList.add('hidden');$('result').classList.add('hidden');$('review').classList.add('hidden');$('keywordPage').classList.add('hidden');$('quiz').classList.remove('hidden');render()}
function updateTimer(){const s=Math.floor((Date.now()-startedAt)/1000);$('timer').textContent=`｜${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`}
function accepted(x){return x.accepted_answers||[x.answer]}
function correctText(x){const a=accepted(x);return a.length===4?'A／B／C／D 皆給分':a.map(i=>ABCD[i]).join('／')}
function render(){const x=quiz[cur],last=cur===quiz.length-1,chosen=answers[x.id];$('qno').textContent=`第 ${cur+1}／${quiz.length} 題｜${x.year}｜${x.subject}｜第 ${x.number} 題`;$('qtext').textContent=x.question;$('prog').style.width=((cur+1)/quiz.length*100)+'%';$('opts').innerHTML=x.choices.map((o,i)=>{let cls='option';if(chosen===i)cls+=' sel';if(mode==='fast'&&chosen!==undefined){if(accepted(x).includes(i))cls+=' correct';else if(chosen===i)cls+=' wrong'}return `<button class="${cls}" onclick="choose(${i})" ${mode==='fast'&&chosen!==undefined?'disabled':''}>${ABCD[i]}. ${esc(o)}</button>`}).join('');$('feedback').innerHTML='';if(mode==='fast'&&chosen!==undefined){const ok=accepted(x).includes(chosen);$('feedback').innerHTML=`<div class="feedback ${ok?'ok':'bad'}"><b>${ok?'✓ 答對':'✗ 答錯'}</b><br>正確答案：<b>${correctText(x)}</b><div class="explain"><b>📌 解析</b><br>${esc(x.explanation||'本題目前沒有來源解析。')}<br><span class="muted">答案依考選部標準答案判定</span></div><div class="keywordbar"><b>🔑 關鍵名詞：</b>${keywordMatches(x).map(k=>`<button class="keywordbtn" onclick="openKeyword('${esc(k)}')">${esc(k)}</button>`).join('')}</div></div>`}$('nav').innerHTML=`<button class="secondary" onclick="toggleUncertain()">${uncertain[x.id]?'✓ 已標記不確定':'？不確定'}</button>${cur>0?'<button class="secondary" onclick="prevQ()">上一題</button>':''}${!last?'<button onclick="nextQ()">下一題</button>':'<button onclick="submitQuiz()">交卷</button>'}`}
function choose(i){const x=quiz[cur];answers[x.id]=i;render()}
function toggleUncertain(){const x=quiz[cur];uncertain[x.id]=!uncertain[x.id];render()}
function nextQ(){if(cur<quiz.length-1){cur++;render()}}
function prevQ(){if(cur>0){cur--;render()}}
function submitQuiz(){clearInterval(timerId);const wrong=quiz.filter(x=>!accepted(x).includes(answers[x.id]));lastWrong=wrong;lastUncertain=quiz.filter(x=>uncertain[x.id]);const score=Math.round((quiz.length-wrong.length)/quiz.length*100);const rec={at:new Date().toISOString(),score,total:quiz.length,wrong:wrong.map(x=>x.id),uncertain:lastUncertain.map(x=>x.id),year:$('year').value,subject:$('subject').value};const history=load('history',[]);history.unshift(rec);save('history',history.slice(0,100));$('quiz').classList.add('hidden');$('result').classList.remove('hidden');$('review').classList.remove('hidden');$('result').innerHTML=`<h2>本次成績：${score} 分</h2><p>答對 ${quiz.length-wrong.length}／${quiz.length} 題｜錯題 ${wrong.length} 題｜不確定 ${lastUncertain.length} 題</p><div class="actions"><button onclick="showReview()">錯題檢討</button><button class="secondary" onclick="goHome()">回首頁</button></div>`;showReview();if(window.swCloudSync)window.swCloudSync('quiz_result',rec)}
function showReview(){const items=lastWrong.length?lastWrong:[];$('review').innerHTML=`<h2>錯題檢討</h2>${items.length?items.map(x=>{const my=answers[x.id];return `<div class="wrong"><div class="tag">${esc(x.year)}｜${esc(x.subject)}｜第 ${esc(x.number)} 題</div><h3>${esc(x.question)}</h3>${x.choices.map((o,i)=>`<div class="option ${accepted(x).includes(i)?'correct':''} ${my===i&&!accepted(x).includes(i)?'wrong':''}">${ABCD[i]}. ${esc(o)} ${accepted(x).includes(i)?'✓ 正確答案':''}${my===i&&!accepted(x).includes(i)?' ← 我的答案':''}</div>`).join('')}<p><b>正確答案：${correctText(x)}</b>｜我的答案：${my===undefined?'未作答':ABCD[my]}</p><div class="explain"><b>📌 解析</b><br>${esc(x.explanation||'本題目前沒有來源解析。')}</div></div>`}).join(''):'<p>本次沒有錯題，做得很好！</p>'}`}
function showWeak(){alert('個人加強區會依你的錯題與不確定紀錄提供練習。')}
function showStats(){const h=load('history',[]);alert(`累積 ${h.length} 次測驗`)}
function goHome(){$('quiz').classList.add('hidden');$('result').classList.add('hidden');$('review').classList.add('hidden');$('keywordPage').classList.add('hidden');$('home').classList.remove('hidden')}
function keywordMatches(x){const t=(x.question||'')+' '+(x.explanation||'');return Object.keys(G).filter(k=>t.includes(k)).slice(0,5)}
function openKeyword(k){$('keywordPage').classList.remove('hidden');$('home').classList.add('hidden');$('quiz').classList.add('hidden');$('result').classList.add('hidden');$('review').classList.add('hidden');$('keywordSearch').value=k;searchKeywords()}
function closeKeyword(){goHome()}
function searchKeywords(){const q=$('keywordSearch').value.trim();const ks=Object.keys(G).filter(k=>!q||k.includes(q)||G[k].a.some(v=>v.toLowerCase().includes(q.toLowerCase())));$('keywordResults').innerHTML=ks.map(k=>{const g=G[k];return `<div class="card keywordHero"><h2>🧠 ${esc(k)}</h2><p>${esc(g.s)}</p><b>重點</b><ul>${g.p.map(v=>`<li>${esc(v)}</li>`).join('')}</ul><p><b>考題聯想：</b>${esc(g.e)}</p><div>${g.r.map(v=>`<button class="keywordbtn" onclick="openKeyword('${esc(v)}')">${esc(v)}</button>`).join('')}</div></div>`}).join('')||'<p>找不到對應名詞。</p>'}
init();
</script>
</body>
</html>
