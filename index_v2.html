<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#2f6f5e"><title>社工師國考｜110–115 歷屆真題備考</title><style>:root{--a:#2f6f5e;--bg:#f5f7f6;--line:#dfe7e3;--ink:#24312d;--muted:#71807a;--soft:#e8f2ee;--warn:#fff8e7}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif}.wrap{max-width:1000px;margin:auto;padding:18px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}@media(max-width:700px){.grid{grid-template-columns:1fr}}label{display:block;color:var(--muted);font-size:13px;margin-bottom:6px}select,button{font:inherit}select{width:100%;padding:12px;border:1px solid #cfdad5;border-radius:10px;background:#fff}button{padding:11px 15px;border:0;border-radius:10px;background:var(--a);color:#fff;font-weight:700;cursor:pointer}.secondary{background:#eef3f0;color:var(--ink);border:1px solid var(--line)}.danger{background:#fff1f1;color:#9b3030;border:1px solid #ecc}.hidden{display:none}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.muted{color:var(--muted);font-size:13px;line-height:1.7}.ok{background:#edf8f2;border:1px solid #cfe4d8;padding:12px;border-radius:12px}.warn{background:var(--warn);border:1px solid #eedcae;padding:12px;border-radius:12px}.bar{height:8px;background:#e8efec;border-radius:9px;overflow:hidden;margin:12px 0}.bar>div{height:100%;background:var(--a);width:0}.option{display:block;width:100%;text-align:left;background:#fff;color:var(--ink);border:1px solid var(--line);margin:9px 0;padding:14px;border-radius:12px}.option.sel{border-color:var(--a);background:var(--soft)}.wrong{border:1px solid #e3dddd;border-radius:14px;padding:15px;margin:10px 0}.explain{background:#f8faf9;border-left:4px solid var(--a);padding:12px;margin-top:10px;line-height:1.8;white-space:pre-wrap}.reason{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.reason button{font-size:12px;padding:8px 10px}.mind{display:none;background:#fbfcfb;border:1px dashed #ccd9d3;border-radius:12px;padding:14px;margin-top:10px}.mind.show{display:block}.chain{display:flex;gap:7px;flex-wrap:wrap;align-items:center}.node{background:var(--soft);color:var(--a);padding:6px 9px;border-radius:9px}.arrow{color:var(--muted)}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}@media(max-width:700px){.stats{grid-template-columns:1fr 1fr}}.stat{background:#f7faf8;padding:14px;border-radius:12px}.stat b{display:block;font-size:24px}a{color:var(--a)}</style></head><body><div class="wrap"><h1>社工師國考｜110–115 歷屆真題備考</h1><p class="muted">📱手機／💻電腦皆可｜網路即可刷題｜排除國文與社會工作管理</p><div id="status" class="card warn">正在載入正式題庫……</div><section id="home" class="card hidden"><h2>開始刷題</h2><div class="grid"><div><label>年度</label><select id="year"><option value="all">全部年度</option><option>115</option><option>114</option><option>113</option><option>112</option><option>111</option><option>110</option></select></div><div><label>科目</label><select id="subject"><option value="all">全部五科</option><option>社會工作</option><option>社會工作直接服務</option><option>社會政策與社會立法</option><option>人類行為與社會環境</option><option>社會工作研究方法</option></select></div><div><label>題數</label><select id="count"><option>10</option><option>20</option><option>30</option><option>40</option><option value="full">完整考一遍</option></select></div></div><p id="pool" class="muted"></p><div class="actions"><button onclick="startQuiz()">開始測驗</button><button class="secondary" onclick="showWeak()">🎯 個人加強區</button><button class="secondary" onclick="showStats()">📊 成績統計</button></div><p class="muted">「為什麼錯」與錯題次數保存在目前裝置瀏覽器。</p></section><section id="quiz" class="card hidden"><b id="qno"></b><div class="bar"><div id="prog"></div></div><h2 id="qtext"></h2><div id="opts"></div><div class="actions"><button class="secondary" onclick="prevQ()">上一題</button><button onclick="nextQ()">下一題</button><button class="danger" onclick="submitQuiz()">交卷</button></div></section><section id="result" class="card hidden"></section><section id="review" class="card hidden"></section></div><script>let BANK=[],quiz=[],cur=0,answers={},lastWrong=[];const $=id=>document.getElementById(id);const mind={"社會工作":['人在情境中','生態系統觀點','個人 ↔ 環境','家庭／組織／社區','整體性評估'],"社會工作直接服務":['專業關係','接納','同理','合作目標'],"社會政策與社會立法":['福利政策','資源分配','公平／正義','制度設計'],"人類行為與社會環境":['發展階段','心理社會發展','人在情境中','環境脈絡'],"社會工作研究方法":['信度','一致性','穩定性','效度','測量']};function load(){try{return JSON.parse(localStorage.getItem('sw_stats')||'{"attempts":[],"questions":{}}')}catch{return{attempts:[],questions:{}}}}function save(s){localStorage.setItem('sw_stats',JSON.stringify(s))}async function init(){try{const r=await fetch('data/bank.json?'+Date.now(),{cache:'no-store'});if(!r.ok)throw 0;const d=await r.json();BANK=d.questions||[];if(BANK.length<1000)throw 0;status.className='card ok';status.innerHTML=`<b>✓ 正式歷屆題庫已載入</b><br>110–115 年｜五科｜共 <b>${BANK.length.toLocaleString()}</b> 題選擇題<br><span class="muted">來源：社工日常｜${d.meta?.papers_ok||0} 份試卷</span>`;home.classList.remove('hidden');updatePool()}catch(e){status.className='card warn';status.innerHTML='<b>題庫正在建置／更新中</b><br>正式題庫尚未成功發布，請稍後重新整理。'}}function filter(){let y=$('year').value,s=$('subject').value;return BANK.filter(x=>(y==='all'||x.year===y)&&(s==='all'||x.subject===s))}function updatePool(){$('pool').textContent=`目前篩選：${filter().length.toLocaleString()} 題｜完整考一遍＝此篩選條件全部題目`}year.onchange=subject.onchange=updatePool;function startQuiz(){let p=filter();if(!p.length)return alert('沒有符合條件的題目');let n=count.value==='full'?p.length:Number(count.value);quiz=[...p].sort(()=>Math.random()-.5).slice(0,Math.min(n,p.length));cur=0;answers={};home.classList.add('hidden');result.classList.add('hidden');review.classList.add('hidden');quizEl().classList.remove('hidden');render()}function quizEl(){return $('quiz')}function render(){let x=quiz[cur];qno.textContent=`第 ${cur+1}／${quiz.length} 題｜${x.year} ${x.session==='1'?'上':'下'}｜${x.subject}｜第 ${x.number} 題`;qtext.textContent=x.question;prog.style.width=((cur+1)/quiz.length*100)+'%';opts.innerHTML=x.choices.map((o,i)=>`<button class="option ${answers[x.id]===i?'sel':''}" onclick="choose(${i})">${String.fromCharCode(65+i)}. ${esc(o)}</button>`).join('')}function choose(i){answers[quiz[cur].id]=i;render()}function nextQ(){if(cur<quiz.length-1){cur++;render()}}function prevQ(){if(cur>0){cur--;render()}}function submitQuiz(){if(!confirm('確定交卷？'))return;let st=load(),correct=0;lastWrong=[];quiz.forEach(x=>{let a=answers[x.id],q=st.questions[x.id]||{wrong:0,right:0,total:0,reasons:{}};q.total++;if(a===x.answer){correct++;q.right++}else{q.wrong++;lastWrong.push({x,a})}st.questions[x.id]=q});let score=Math.round(correct/quiz.length*100);st.attempts.unshift({at:new Date().toISOString(),score,correct,total:quiz.length});st.attempts=st.attempts.slice(0,100);save(st);quizEl().classList.add('hidden');result.classList.remove('hidden');result.innerHTML=`<h2>本次成績</h2><div class="stats"><div class="stat">分數<b>${score}</b></div><div class="stat">答對<b>${correct}</b></div><div class="stat">答錯<b>${quiz.length-correct}</b></div><div class="stat">題數<b>${quiz.length}</b></div></div><div class="actions"><button onclick="showReview()">檢討錯題</button><button class="secondary" onclick="goHome()">回首頁</button></div>`;showReview()}function esc(s){return String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#39;')}function showReview(){result.classList.add('hidden');review.classList.remove('hidden');review.innerHTML='<h2>錯題檢討</h2>'+(lastWrong.length?lastWrong.map(({x,a})=>{let correct=String.fromCharCode(65+x.answer),mine=a==null?'未作答':String.fromCharCode(65+a);return `<div class="wrong"><b>${x.year} ${x.session==='1'?'上':'下'}｜${x.subject}｜第 ${x.number} 題</b><p>${esc(x.question)}</p><p>你的答案：${mine}｜正確答案：<b>${correct}</b></p><div class="explain"><b>解析</b><br>${esc(x.explanation||'此題來源頁未提供文字解析。')}<br><small>來源：<a href="${x.source}" target="_blank" rel="noopener">社工日常歷屆試題</a></small></div><div class="reason">${['完全不會','觀念混淆','選項搞混','看錯題目','粗心／判斷失誤','法規／年份記錯'].map(r=>`<button class="secondary" onclick="reason('${esc(x.id)}','${esc(r)}')">${r}</button>`).join('')}</div><small id="reason_${esc(x.id)}"></small><div class="actions"><button class="secondary" onclick="toggleMind(this,'${esc(x.subject)}')">🧠 關鍵字心智擴散</button></div><div class="mind"></div></div>`}).join(''):'<p>本次沒有錯題。</p>')}function reason(id,r){let st=load(),q=st.questions[id]||{wrong:0,right:0,total:0,reasons:{}};q.reasons[r]=(q.reasons[r]||0)+1;st.questions[id]=q;save(st);let e=document.getElementById('reason_'+id);if(e)e.textContent=`已記錄「${r}」｜本題錯 ${q.wrong} 次`}function toggleMind(btn,s){let m=btn.parentElement.nextElementSibling,a=mind[s]||['核心關鍵字','核心概念','相關概念'];m.className='mind show';m.innerHTML='<div class="chain">'+a.map((x,i)=>(i?'<span class="arrow">→</span>':'')+`<span class="node">${x}</span>`).join('')+'</div><p class="muted">看到關鍵字 → 優先想到核心概念 → 再向相關概念擴散。</p>'}function showWeak(){let st=load(),rows=Object.entries(st.questions).filter(([id,q])=>q.wrong>=3);review.classList.remove('hidden');result.classList.add('hidden');review.innerHTML=`<h2>🎯 個人加強區</h2><p>同一題錯 3 次以上：<b>${rows.length}</b> 題</p>`+(rows.length?rows.map(([id,q])=>{let x=BANK.find(z=>z.id===id);return x?`<div class="wrong"><b>${x.year} ${x.session==='1'?'上':'下'}｜${x.subject}｜第 ${x.number} 題</b><p>${esc(x.question)}</p><small>錯 ${q.wrong} 次｜答對 ${q.right} 次</small></div>`:''}).join(''):'<p>目前沒有錯 3 次以上的題目。</p>')}function showStats(){let st=load(),qs=Object.values(st.questions),attempts=st.attempts||[],wrong=qs.reduce((a,q)=>a+q.wrong,0),right=qs.reduce((a,q)=>a+q.right,0);review.classList.remove('hidden');result.classList.add('hidden');review.innerHTML=`<h2>📊 成績統計</h2><div class="stats"><div class="stat">測驗次數<b>${attempts.length}</b></div><div class="stat">作答題數<b>${qs.reduce((a,q)=>a+q.total,0)}</b></div><div class="stat">答對<b>${right}</b></div><div class="stat">答錯<b>${wrong}</b></div></div><h3>最近成績</h3>`+(attempts.slice(0,10).map(a=>`<p>${new Date(a.at).toLocaleString()}｜${a.score} 分｜${a.correct}/${a.total}</p>`).join('')||'<p>尚無紀錄。</p>')}function goHome(){result.classList.add('hidden');review.classList.add('hidden');home.classList.remove('hidden');updatePool()}init();</script><script src="study_modes_v2.js?v=2"></script>
</body></html>
