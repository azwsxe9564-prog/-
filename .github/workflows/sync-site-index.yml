name: Sync site index
on:
  push:
    branches: [main]
    paths:
      - site_index.html
      - .github/workflows/sync-site-index.yml
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace published index
        run: |
          cp site_index.html index.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "index.html already up to date"
          else
            git commit -m "Update quiz UI: uncertainty and personal strengthening rules"
            git push
          fi
