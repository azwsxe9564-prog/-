name: Install study modes
on:
  push:
    branches: [main]
    paths:
      - study_modes.js
      - .github/workflows/install-study-modes.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject study mode script
        shell: python
        run: |
          from pathlib import Path
          p=Path('site_index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="study_modes.js?v=1"></script>'
          if tag not in s:
              if '</body>' not in s:
                  raise SystemExit('site_index.html has no </body>')
              s=s.replace('</body>',tag+'\n</body>',1)
              p.write_text(s,encoding='utf-8')
              print('Injected study_modes.js')
          else:
              print('study_modes.js already injected')
      - name: Commit site index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site_index.html
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "Enable fast Q&A and mock exam modes"
            git push
          fi
