name: Import and verify 115-2 official social work exam

on:
  push:
    branches: [main]
    paths:
      - 'import_1152_official.py'
      - 'yamol_fallback.py'
      - '.github/workflows/import-1152.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: import-1152
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PDF parser
        run: python -m pip install --disable-pip-version-check pypdf
      - name: Validate importer
        run: python -m py_compile build_bank_v4.py import_1152_official.py yamol_fallback.py
      - name: Import 115-2 from MOEX official PDFs with Yamol fallback
        run: python import_1152_official.py
      - name: Verify 115-2 is complete and official-answer verified
        run: |
          python - <<'PY'
          import json
          p=json.load(open('data/bank.json',encoding='utf-8'))
          qs=[q for q in p.get('questions',[]) if q.get('year')=='115' and q.get('session')=='2']
          subjects=sorted({q.get('subject') for q in qs})
          expected=['人類行為與社會環境','社會工作','社會工作直接服務','社會工作研究方法','社會政策與社會立法']
          if subjects != expected:
              raise SystemExit(f'115-2 subjects mismatch: {subjects}')
          report=p.get('meta',{}).get('official_115_2_report',[])
          if len(report)!=5:
              raise SystemExit(f'115-2 report incomplete: {len(report)}')
          for s in expected:
              rows=[q for q in qs if q.get('subject')==s]
              r=next(x for x in report if x['subject']==s)
              if len(rows) != r['question_count']:
                  raise SystemExit(f'{s}: expected {r["question_count"]}, got {len(rows)}')
              if any(not q.get('answer_verified') for q in rows):
                  raise SystemExit(f'{s}: found unverified answers')
              if any(len(q.get('choices',[])) != 4 for q in rows):
                  raise SystemExit(f'{s}: malformed choices')
              if any(q.get('answer') not in (0,1,2,3) for q in rows):
                  raise SystemExit(f'{s}: invalid primary answer')
              if any(not q.get('accepted_answers') for q in rows):
                  raise SystemExit(f'{s}: missing accepted answers')
          expected_total=sum(x['question_count'] for x in report)
          if len(qs) != expected_total:
              raise SystemExit(f'115-2 total question count mismatch: expected {expected_total}, got {len(qs)}')
          print('115-2 verified questions =',len(qs))
          for x in report: print(x['subject'], '=', x['question_count'], '|', x.get('question_source'))
          PY
      - name: Commit verified 115-2 bank
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/bank.json
          if git diff --cached --quiet; then
            echo 'No 115-2 bank changes detected.'
          else
            git commit -m 'Add verified 115-2 official-answer question bank'
            git push
          fi
