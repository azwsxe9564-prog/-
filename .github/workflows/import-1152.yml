name: Import and verify 115-2 official social work exam

on:
  push:
    branches: [main]
    paths:
      - 'import_1152_official.py'
      - '.github/workflows/import-1152.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: import-1152
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PDF parser
        run: python -m pip install --disable-pip-version-check pypdf
      - name: Validate importer
        run: python -m py_compile build_bank_v4.py import_1152_official.py
      - name: Import 115-2 from MOEX official PDFs
        run: python import_1152_official.py
      - name: Verify 115-2 is complete and official-answer verified
        run: |
          python - <<'PY'
          import json
          p=json.load(open('data/bank.json',encoding='utf-8'))
          qs=[q for q in p.get('questions',[]) if q.get('year')=='115' and q.get('session')=='2']
          subjects=sorted({q.get('subject') for q in qs})
          expected=['人類行為與社會環境','社會工作','社會工作直接服務','社會工作研究方法','社會政策與社會立法']
          if subjects != expected:
              raise SystemExit(f'115-2 subjects mismatch: {subjects}')
          for s in expected:
              rows=[q for q in qs if q.get('subject')==s]
              report=next(x for x in p['meta']['official_115_2_report'] if x['subject']==s)
              if len(rows) != report['question_count']:
                  raise SystemExit(f'{s}: expected {report["question_count"]}, got {len(rows)}')
              if any(not q.get('answer_verified') for q in rows):
                  raise SystemExit(f'{s}: found unverified answers')
              if any(len(q.get('choices',[])) != 4 for q in rows):
                  raise SystemExit(f'{s}: malformed choices')
          if len(qs) != sum(x['question_count'] for x in p['meta']['official_115_2_report']):
              raise SystemExit('115-2 total question count mismatch')
          print('115-2 verified questions =',len(qs))
          print('115-2 report =',p['meta']['official_115_2_report'])
          PY
      - name: Commit verified 115-2 bank
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/bank.json
          git commit -m 'Add verified 115-2 official social work exam' || echo 'No changes to commit.'
          git push || true
