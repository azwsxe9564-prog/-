name: Install local progress module
on:
  push:
    branches: [main]
    paths:
      - local_progress.js
      - .github/workflows/install-local-progress.yml
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject local progress script
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="local_progress.js"></script>'
          if tag not in s:
              if '</body>' not in s:
                  raise SystemExit('index.html has no body close tag')
              s=s.replace('</body>',tag+'\n</body>',1)
              p.write_text(s,encoding='utf-8')
      - name: Commit injected script
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then echo "No changes needed"; else git commit -m "Enable local-only study history and backup"; git push; fi
