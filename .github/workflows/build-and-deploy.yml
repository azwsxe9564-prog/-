name: Build and deploy study site

on:
  push:
    branches: [main]
  schedule:
    - cron: '15 18 */5 * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install sync dependency
        if: github.event_name == 'schedule'
        run: python -m pip install --disable-pip-version-check pypdf

      - name: Sync Socialworkerdaily updates
        if: github.event_name == 'schedule'
        continue-on-error: true
        run: python sync_socialworkerdaily.py || echo 'Socialworkerdaily sync failed; keeping current bank.'

      - name: Commit synced bank when changed
        if: github.event_name == 'schedule'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/bank.json
          if git diff --cached --quiet; then
            echo 'No question-bank changes.'
          else
            git commit -m 'chore: sync Socialworkerdaily question bank [skip ci]'
            git push
          fi

      - name: Validate source bank
        run: |
          test -s site_index_v4.html
          test -s data/bank.json
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('data/bank.json').read_text(encoding='utf-8'))
          qs=data.get('questions', [])
          if not qs:
              raise SystemExit('Question bank is empty')
          for i,q in enumerate(qs):
              if not q.get('id') or not q.get('question') or not isinstance(q.get('choices'),list) or len(q['choices']) != 4:
                  raise SystemExit(f'Malformed question record: {i}')
          print('question_count=',len(qs))
          PY

      - name: Prepare Pages site
        run: |
          rm -rf _site
          mkdir -p _site/data
          cp site_index_v4.html _site/index.html
          cp data/bank.json _site/data/bank.json
          cp cloud_sync.js site_enhancements.js review_order_fix.js review_render_fix.js _site/
          python - <<'PY'
          from pathlib import Path
          p=Path('_site/index.html')
          html=p.read_text(encoding='utf-8')
          scripts='''\n<!-- Optional enhancements are isolated from the core application. -->\n<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>\n<script src="./cloud_sync.js"></script>\n<script src="./site_enhancements.js"></script>\n<script src="./review_order_fix.js"></script>\n<script src="./review_render_fix.js"></script>\n'''
          if '</body>' not in html:
              raise SystemExit('site_index_v4.html has no closing body tag')
          html=html.replace('</body>',scripts+'</body>',1)
          p.write_text(html,encoding='utf-8')
          PY
          touch _site/.nojekyll

      - name: Smoke test generated site
        run: |
          test -s _site/index.html
          test -s _site/data/bank.json
          grep -q '社工師國考' _site/index.html
          grep -q 'id="status"' _site/index.html
          python - <<'PY'
          from pathlib import Path
          html=Path('_site/index.html').read_text(encoding='utf-8')
          if html.count('<html') != 1 or html.count('</html>') != 1:
              raise SystemExit('Generated HTML document structure is invalid')
          print('Generated Pages site smoke test: OK')
          PY

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
