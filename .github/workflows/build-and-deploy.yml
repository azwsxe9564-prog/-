name: Build and deploy study site

on:
  push:
    branches: [main]
  schedule:
    - cron: '15 18 */5 * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        if: github.event_name == 'schedule'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install sync dependency
        if: github.event_name == 'schedule'
        run: python -m pip install --disable-pip-version-check pypdf

      - name: Sync 社工日常 updates
        if: github.event_name == 'schedule'
        continue-on-error: true
        run: python sync_socialworkerdaily.py

      - name: Commit synced bank when changed
        if: github.event_name == 'schedule'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/bank.json
          if git diff --cached --quiet; then
            echo 'No question-bank changes.'
          else
            git commit -m 'chore: sync Socialworkerdaily question bank [skip ci]'
            git push
          fi

      - name: Validate bank file exists
        run: |
          test -s data/bank.json
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('data/bank.json').read_text(encoding='utf-8'))
          qs=data.get('questions', [])
          if not qs:
              raise SystemExit('Question bank is empty')
          bad=[]
          for i,q in enumerate(qs):
              if not q.get('id') or not q.get('question') or not isinstance(q.get('choices'),list) or len(q['choices']) != 4:
                  bad.append(i)
          if bad:
              raise SystemExit(f'Malformed question records: {len(bad)}')
          print('question_count=',len(qs))
          print('papers_ok=',data.get('meta',{}).get('papers_ok'))
          PY

      - name: Prepare Pages site
        run: |
          rm -rf _site
          mkdir -p _site/data
          cp site_index_v4.html _site/index.html
          cp data/bank.json _site/data/bank.json
          cat >> _site/index.html <<'HTML'
          <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
          <script>
          HTML
          cat cloud_sync.js >> _site/index.html
          cat site_enhancements.js >> _site/index.html
          cat review_order_fix.js >> _site/index.html
          cat review_render_fix.js >> _site/index.html
          cat remove_auth_ui.js >> _site/index.html
          cat >> _site/index.html <<'HTML'
          </script>
          HTML
          touch _site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
