<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#2f6f5e"><title>社工師國考｜110–115 歷屆真題備考</title><style>body{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif;margin:0;background:#f5f7f6;color:#24312d}.wrap{max-width:960px;margin:auto;padding:24px}.card{background:#fff;border:1px solid #dfe7e3;border-radius:18px;padding:20px;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}@media(max-width:700px){.grid{grid-template-columns:1fr}}label{display:block;color:#66746e;font-size:13px;margin-bottom:6px}select,button{font:inherit}select{width:100%;padding:12px;border:1px solid #cfdad5;border-radius:10px;background:#fff}button{padding:12px 16px;border:0;border-radius:10px;background:#2f6f5e;color:#fff;font-weight:700}.secondary{background:#eef3f0;color:#24312d;border:1px solid #dfe7e3}.option{display:block;width:100%;text-align:left;background:#fff;color:#24312d;border:1px solid #dfe7e3;margin:9px 0;padding:14px;border-radius:12px}.option.sel{border-color:#2f6f5e;background:#e8f2ee}.hidden{display:none}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.tag{display:inline-block;background:#e8f2ee;color:#2f6f5e;border-radius:999px;padding:4px 8px;font-size:12px;margin:2px}.wrong{border:1px solid #e3dddd;border-radius:14px;padding:14px;margin:10px 0}.mind{display:none;background:#fbfcfb;border:1px dashed #ccd9d3;border-radius:12px;padding:14px;margin-top:10px}.mind.show{display:block}.chain{display:flex;gap:7px;flex-wrap:wrap;align-items:center}.node{background:#e8f2ee;color:#2f6f5e;padding:6px 9px;border-radius:9px}.arrow{color:#6b7772}.muted{color:#71807a;font-size:13px;line-height:1.7}.stat{font-size:28px;font-weight:800}.bar{height:8px;background:#e8efec;border-radius:9px;overflow:hidden}.bar>div{height:100%;background:#2f6f5e;width:0}.modal{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;padding:18px}.modal.show{display:flex}.modalbox{background:#fff;border-radius:18px;max-width:720px;width:100%;padding:20px}</style></head><body><div class="wrap"><h1>社工師國考｜110–115 歷屆真題備考</h1><div class="card"><b>🌐 線上版</b><p class="muted">可用電腦、手機瀏覽器開啟。個人錯題與成績會儲存在目前裝置的瀏覽器。</p></div><div id="home" class="card"><h2>開始刷題</h2><div class="grid"><div><label>年度</label><select id="year"><option value="all">全部年度</option><option>115</option><option>114</option><option>113</option><option>112</option><option>111</option><option>110</option></select></div><div><label>科目</label><select id="subject"><option value="all">全部五科</option><option>社會工作</option><option>社會工作直接服務</option><option>社會政策與社會立法</option><option>人類行為與社會環境</option><option>社會工作研究方法</option></select></div><div><label>題數</label><select id="count"><option>10</option><option>20</option><option>30</option><option>40</option><option value="full">完整考一遍</option></select></div></div><p class="muted">正式版會使用嵌入題庫；本頁先讓線上測驗介面直接可用。</p><div class="actions"><button onclick="startQuiz()">開始測驗</button><button class="secondary" onclick="showStats()">錯題／統計</button></div></div><div id="quiz" class="card hidden"><div><b id="qno"></b></div><div class="bar"><div id="prog"></div></div><h2 id="qtext"></h2><div id="opts"></div><div class="actions"><button class="secondary" onclick="prevQ()">上一題</button><button onclick="nextQ()">下一題</button><button class="secondary" onclick="submitQuiz()">交卷</button></div></div><div id="result" class="card hidden"></div><div id="review" class="card hidden"></div></div><script>const BANK=[{id:'r1',year:'115',subject:'社會工作',q:'依「人在情境中」觀點，評估個案時最適當的是？',o:['只看個人特質','只看家庭','同時理解個人與環境互動','只看制度'],a:2,ex:'人在情境中強調個人與環境的互動。'},{id:'r2',year:'114',subject:'人類行為與社會環境',q:'Erikson成年早期主要發展任務為何？',o:['信任對不信任','自主對羞愧','親密對孤立','完整對絕望'],a:2,ex:'成年早期的重要發展任務為親密對孤立。'},{id:'r3',year:'113',subject:'社會工作直接服務',q:'初次會談較適當的作法為何？',o:['立即替案主決定','先建立關係與了解需求','避免談感受','直接訂定所有目標'],a:1,ex:'初次會談先建立關係並理解案主觀點與需求。'},{id:'r4',year:'112',subject:'社會政策與社會立法',q:'社會福利立法的重要功能為何？',o:['建立制度與權利義務規範','取代所有家庭功能','消除所有問題','只規範社工個人'],a:0,ex:'福利立法提供制度、資格、權利義務等規範。'},{id:'r5',year:'111',subject:'社會工作研究方法',q:'信度最主要描述什麼？',o:['測量的一致與穩定','樣本一定很大','倫理審查','研究有趣程度'],a:0,ex:'信度著重測量的一致性與穩定性。'}];let quiz=[],cur=0,ans={};function startQuiz(){let y=year.value,s=subject.value,pool=BANK.filter(x=>(y==='all'||x.year===y)&&(s==='all'||x.subject===s));let n=count.value==='full'?pool.length:Number(count.value);quiz=[...pool].sort(()=>Math.random()-0.5).slice(0,n);if(!quiz.length){alert('目前沒有符合篩選條件的題目');return}cur=0;ans={};home.classList.add('hidden');quizEl().classList.remove('hidden');render()}function quizEl(){return document.getElementById('quiz')}function render(){let x=quiz[cur];qno.textContent=`第 ${cur+1}/${quiz.length} 題｜${x.year}｜${x.subject}`;qtext.textContent=x.q;prog.style.width=((cur+1)/quiz.length*100)+'%';opts.innerHTML=x.o.map((o,i)=>`<button class="option ${ans[x.id]===i?'sel':''}" onclick="choose(${i})">${String.fromCharCode(65+i)}. ${o}</button>`).join('')}function choose(i){ans[quiz[cur].id]=i;render()}function nextQ(){if(cur<quiz.length-1){cur++;render()}}function prevQ(){if(cur>0){cur--;render()}}function submitQuiz(){let c=quiz.filter(x=>ans[x.id]===x.a).length;quizEl().classList.add('hidden');result.classList.remove('hidden');result.innerHTML=`<h2>測驗完成</h2><div class="stat">${Math.round(c/quiz.length*100)} 分</div><p>答對 ${c} / ${quiz.length}</p><div class="actions"><button onclick="showReview()">檢討錯題</button><button class="secondary" onclick="location.reload()">再考一次</button></div>`}function showReview(){result.classList.add('hidden');review.classList.remove('hidden');let w=quiz.filter(x=>ans[x.id]!==x.a);review.innerHTML='<h2>錯題檢討</h2>'+ (w.length?w.map(x=>`<div class="wrong"><b>${x.year}｜${x.subject}</b><p>${x.q}</p><p>你的答案：${ans[x.id]===undefined?'未作答':String.fromCharCode(65+ans[x.id])}｜正確：${String.fromCharCode(65+x.a)}</p><div><b>解析</b><br>${x.ex}</div><div class="actions"><button class="secondary" onclick="showMind(this,'${x.subject}')">🧠 關鍵字心智擴散</button></div><div class="mind"></div></div>`).join(''):'<p>本次沒有錯題。</p>')}function showMind(btn,subject){let m=btn.parentElement.nextElementSibling;let map={"社會工作":['人在情境中','生態系統觀點','個人 ↔ 環境','家庭／組織／社區','整體性評估'],"社會工作直接服務":['專業關係','接納','同理','合作目標'],"社會政策與社會立法":['福利政策','資源分配','公平／正義','制度設計'],"人類行為與社會環境":['Erikson','心理社會發展','發展任務'],"社會工作研究方法":['信度','一致性','穩定性','效度']}[subject]||['核心關鍵字','核心概念','相關概念'];m.className='mind show';m.innerHTML='<div class="chain">'+map.map((x,i)=>(i?'<span class="arrow">→</span>':'')+`<span class="node">${x}</span>`).join('')+'</div>'}function showStats(){let s=JSON.parse(localStorage.getItem('sw_stats')||'{}');review.classList.remove('hidden');review.innerHTML='<h2>錯題／統計</h2><p class="muted">你的裝置目前沒有足夠的作答紀錄可顯示。</p>'} </script></body></html>
