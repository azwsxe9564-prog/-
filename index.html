<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#2f6f5e"><title>社工師國考｜110–115 歷屆真題備考</title><style>:root{--a:#2f6f5e;--bg:#f5f7f6;--line:#dfe7e3;--ink:#24312d;--muted:#71807a;--soft:#e8f2ee}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif}.wrap{max-width:1000px;margin:auto;padding:20px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}@media(max-width:700px){.grid{grid-template-columns:1fr}}label{display:block;color:var(--muted);font-size:13px;margin-bottom:6px}select,button{font:inherit}select{width:100%;padding:12px;border:1px solid #cfdad5;border-radius:10px;background:#fff}button{padding:11px 15px;border:0;border-radius:10px;background:var(--a);color:#fff;font-weight:700;cursor:pointer}.secondary{background:#eef3f0;color:var(--ink);border:1px solid var(--line)}.option{display:block;width:100%;text-align:left;background:#fff;color:var(--ink);border:1px solid var(--line);margin:9px 0;padding:14px;border-radius:12px}.option.sel{border-color:var(--a);background:var(--soft)}.hidden{display:none}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.muted{color:var(--muted);font-size:13px;line-height:1.7}.bar{height:8px;background:#e8efec;border-radius:9px;overflow:hidden;margin:12px 0}.bar>div{height:100%;background:var(--a);width:0}.wrong{border:1px solid #e3dddd;border-radius:14px;padding:15px;margin:10px 0}.mind{display:none;background:#fbfcfb;border:1px dashed #ccd9d3;border-radius:12px;padding:14px;margin-top:10px}.mind.show{display:block}.chain{display:flex;gap:7px;flex-wrap:wrap;align-items:center}.node{background:var(--soft);color:var(--a);padding:6px 9px;border-radius:9px}.arrow{color:var(--muted)}.statgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}@media(max-width:700px){.statgrid{grid-template-columns:1fr 1fr}}.stat{background:#f7faf8;padding:14px;border-radius:12px}.stat b{display:block;font-size:24px}.ok{background:#edf8f2;border:1px solid #cfe4d8;padding:12px;border-radius:12px}.warn{background:#fff8e7;padding:12px;border-radius:12px}.reason button{font-size:12px;padding:8px 10px}</style></head><body><div class="wrap"><h1>社工師國考｜110–115 歷屆真題備考</h1><div id="status" class="card warn">正在載入正式題庫……</div><section id="home" class="card hidden"><h2>開始刷題</h2><div class="grid"><div><label>年度</label><select id="year"><option value="all">全部年度</option><option>115</option><option>114</option><option>113</option><option>112</option><option>111</option><option>110</option></select></div><div><label>科目</label><select id="subject"><option value="all">全部五科</option><option>社會工作</option><option>社會工作直接服務</option><option>社會政策與社會立法</option><option>人類行為與社會環境</option><option>社會工作研究方法</option></select></div><div><label>題數</label><select id="count"><option>10</option><option>20</option><option>30</option><option>40</option><option value="full">完整考一遍</option></select></div></div><p id="pool" class="muted"></p><div class="actions"><button onclick="startQuiz()">開始測驗</button><button class="secondary" onclick="showWeak()">個人加強區</button><button class="secondary" onclick="showStats()">成績統計</button></div></section><section id="quiz" class="card hidden"><b id="qno"></b><div class="bar"><div id="prog"></div></div><h2 id="qtext"></h2><div id="opts"></div><div class="actions"><button class="secondary" onclick="prevQ()">上一題</button><button onclick="nextQ()">下一題</button><button class="secondary" onclick="submitQuiz()">交卷</button></div></section><section id="result" class="card hidden"></section><section id="review" class="card hidden"></section></div><script>let BANK=[],quiz=[],cur=0,ans={},lastWrong=[];const $=id=>document.getElementById(id);const subjects=['社會工作','社會工作直接服務','社會政策與社會立法','人類行為與社會環境','社會工作研究方法'];const mind={"社會工作":['人在情境中','生態系統觀點','個人 ↔ 環境','家庭／組織／社區','整體性評估'],"社會工作直接服務":['專業關係','接納','同理','合作目標'],"社會政策與社會立法":['福利政策','資源分配','公平／正義','制度設計'],"人類行為與社會環境":['發展階段','心理社會發展','人在情境中','環境脈絡'],"社會工作研究方法":['信度','一致性','穩定性','效度','測量']};const key=x=>`sw_${x}`;function load(k,d){try{return JSON.parse(localStorage.getItem(key(k))||'null')??d}catch{return d}}function save(k,v){localStorage.setItem(key(k),JSON.stringify(v))}async function init(){try{let r=await fetch('data/bank.json',{cache:'no-store'});if(!r.ok)throw Error('題庫尚未完成建置');let d=await r.json();BANK=d.questions||[];status.className='card ok';status.innerHTML=`<b>✓ 正式歷屆題庫已載入</b><br>110–115 年｜五科｜共 ${BANK.length.toLocaleString()} 題選擇題<br><span class="muted">來源：考選部試題／答案資料；申論已排除。更正答案以官方更正資料為準。</span>`;home.classList.remove('hidden');updatePool()}catch(e){status.innerHTML='<b>題庫正在建置中</b><br>GitHub Actions 會自動下載考選部試題與答案、解析並產生正式題庫。完成後重新整理本頁即可。'}}function updatePool(){let p=filter();pool.textContent=`目前篩選：${p.length.toLocaleString()} 題｜完整考一遍＝此篩選條件全部題目`}function filter(){let y=year.value,s=subject.value;return BANK.filter(x=>(y==='all'||x.year===y)&&(s==='all'||x.subject===s))}year.onchange=subject.onchange=updatePool;function startQuiz(){let p=filter();if(!p.length)return alert('沒有符合條件的題目');let n=count.value==='full'?p.length:Number(count.value);quiz=[...p].sort(()=>Math.random()-.5).slice(0,Math.min(n,p.length));cur=0;ans={};home.classList.add('hidden');result.classList.add('hidden');review.classList.add('hidden');quizEl().classList.remove('hidden');render()}function quizEl(){return $('quiz')}function render(){let x=quiz[cur];qno.textContent=`第 ${cur+1}／${quiz.length} 題｜${x.year}｜${x.subject}`;qtext.textContent=x.question;prog.style.width=((cur+1)/quiz.length*100)+'%';opts.innerHTML=x.choices.map((o,i)=>`<button class="option ${ans[x.id]===i?'sel':''}" onclick="choose(${i})">${String.fromCharCode(65+i)}. ${o}</button>`).join('')}function choose(i){ans[quiz[cur].id]=i;render()}function nextQ(){if(cur<quiz.length-1){cur++;render()}}function prevQ(){if(cur>0){cur--;render()}}function submitQuiz(){let st=load('stats',{attempts:[],questions:{}}),correct=0;lastWrong=[];quiz.forEach(x=>{let a=ans[x.id],q=st.questions[x.id]||{wrong:0,right:0,total:0,reasons:{}};q.total++;if(a===x.answer){correct++;q.right++}else{q.wrong++;lastWrong.push({x,a});}st.questions[x.id]=q});st.attempts.unshift({at:new Date().toISOString(),score:Math.round(correct/quiz.length*100),correct,total:quiz.length});save('stats',st);quizEl().classList.add('hidden');result.classList.remove('hidden');result.innerHTML=`<h2>本次成績</h2><div class="statgrid"><div class="stat"><small>分數</small><b>${Math.round(correct/quiz.length*100)}</b></div><div class="stat"><small>答對</small><b>${correct}</b></div><div class="stat"><small>答錯</small><b>${quiz.length-correct}</b></div><div class="stat"><small>題數</small><b>${quiz.length}</b></div></div><div class="actions"><button onclick="showReview()">檢討錯題</button><button class="secondary" onclick="goHome()">回首頁</button></div>`;showReview()}function showReview(){result.classList.add('hidden');review.classList.remove('hidden');review.innerHTML='<h2>錯題檢討</h2>'+(lastWrong.length?lastWrong.map(({x,a})=>{let id=x.id;return `<div class="wrong"><b>${x.year}｜${x.subject}｜第 ${x.number} 題</b><p>${x.question}</p><p>你的答案：${a==null?'未作答':String.fromCharCode(65+a)}｜正確答案：${String.fromCharCode(65+x.answer)}</p><div><b>解析</b><br>官方答案為 ${String.fromCharCode(65+x.answer)}。重新閱讀題幹，先抓核心考點，再比較各選項。</div><div class="reason actions">${['完全不會','觀念混淆','選項搞混','看錯題目','粗心／判斷失誤','法規／年份記錯'].map(r=>`<button class="secondary" onclick="reason('${id}','${r}')">${r}</button>`).join('')}</div><small id="r_${CSS.escape(id)}"></small><div class="actions"><button class="secondary" onclick="toggleMind(this,'${x.subject}')">🧠 關鍵字心智擴散</button></div><div class="mind"></div></div>`}).join(''):'<p>本次沒有錯題。</p>')}function reason(id,r){let st=load('stats',{attempts:[],questions:{}});st.questions[id]??={wrong:0,right:0,total:0,reasons:{}};st.questions[id].reasons[r]=(st.questions[id].reasons[r]||0)+1;save('stats',st);let el=document.querySelector('#r_'+CSS.escape(id));if(el)el.textContent=`已記錄：${r}`}function toggleMind(btn,s){let m=btn.parentElement.nextElementSibling;let a=mind[s]||['核心關鍵字','核心概念','相關概念'];m.className='mind show';m.innerHTML='<div class="chain">'+a.map((x,i)=>(i?'<span class="arrow">→</span>':'')+`<span class="node">${x}</span>`).join('')+'</div><p class="muted">看到關鍵字 → 先想到核心概念 → 再向相關概念擴散。</p>'}function showWeak(){let st=load('stats',{attempts:[],questions:{}}),ids=Object.entries(st.questions).filter(([id,v])=>v.wrong>=3);review.classList.remove('hidden');result.classList.add('hidden');review.innerHTML=`<h2>🎯 個人加強區</h2><p>錯 3 次以上：<b>${ids.length}</b> 題</p>`+(ids.length?ids.map(([id,v])=>{let x=BANK.find(q=>q.id===id);return x?`<div class="wrong"><b>${x.year}｜${x.subject}｜第 ${x.number} 題</b><p>${x.question}</p><small>錯誤 ${v.wrong} 次｜答對 ${v.right} 次</small></div>`:''}).join(''):'<p>目前沒有錯 3 次以上的題目。</p>')}function showStats(){let st=load('stats',{attempts:[],questions:{}}),v=Object.values(st.questions),t=v.reduce((a,x)=>a+x.total,0),r=v.reduce((a,x)=>a+x.right,0);review.classList.remove('hidden');review.innerHTML=`<h2>📊 成績統計</h2><div class="statgrid"><div class="stat"><small>累計作答</small><b>${t}</b></div><div class="stat"><small>答對</small><b>${r}</b></div><div class="stat"><small>正確率</small><b>${t?Math.round(r/t*100):0}%</b></div><div class="stat"><small>高危題</small><b>${v.filter(x=>x.wrong>=3).length}</b></div></div><h3>最近測驗</h3>${st.attempts.slice(0,10).map(a=>`<p>${new Date(a.at).toLocaleString()}｜${a.score} 分｜${a.correct}/${a.total}</p>`).join('')||'<p>尚無紀錄。</p>'}`}function goHome(){result.classList.add('hidden');review.classList.add('hidden');home.classList.remove('hidden')}init()</script></body></html>
