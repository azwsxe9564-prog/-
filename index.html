<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2f6f5e"><title>社工師國考｜110–115 歷屆真題備考</title>
<style>
:root{--a:#2f6f5e;--bg:#f5f7f6;--line:#dfe7e3;--ink:#24312d;--muted:#71807a;--soft:#e8f2ee;--danger:#a33b3b;--warn:#fff7df}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif}.wrap{max-width:1000px;margin:auto;padding:18px}
.hero{padding:8px 0}.hero h1{margin:0 0 6px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;margin:12px 0}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}@media(max-width:700px){.grid{grid-template-columns:1fr}}
label{display:block;color:var(--muted);font-size:13px;margin-bottom:6px}select,button{font:inherit}select{width:100%;padding:12px;border:1px solid #cfdad5;border-radius:10px;background:#fff}
button{padding:11px 15px;border:0;border-radius:10px;background:var(--a);color:#fff;font-weight:700;cursor:pointer}.secondary{background:#eef3f0;color:var(--ink);border:1px solid var(--line)}.danger{background:#fff1f1;color:var(--danger);border:1px solid #efcccc}
.uncertain{background:#fff7df;color:#725800;border:1px solid #e7d28a}.uncertain.on{background:#725800;color:#fff}.option{display:block;width:100%;text-align:left;background:#fff;color:var(--ink);border:1px solid var(--line);margin:9px 0;padding:14px;border-radius:12px}.option.sel{border-color:var(--a);background:var(--soft)}
.hidden{display:none}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.muted{color:var(--muted);font-size:13px;line-height:1.7}.meta{font-size:12px;color:var(--muted)}
.bar{height:8px;background:#e8efec;border-radius:9px;overflow:hidden;margin:12px 0}.bar>div{height:100%;background:var(--a);width:0}.wrong{border:1px solid #e3dddd;border-radius:14px;padding:15px;margin:10px 0}.explain{background:#f8faf9;border-left:4px solid var(--a);padding:12px;margin-top:10px;line-height:1.7}
.mind{display:none;background:#fbfcfb;border:1px dashed #ccd9d3;border-radius:12px;padding:14px;margin-top:10px}.mind.show{display:block}.chain{display:flex;gap:7px;flex-wrap:wrap;align-items:center}.node{background:var(--soft);color:var(--a);padding:6px 9px;border-radius:9px}.arrow{color:var(--muted)}
.statgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}@media(max-width:700px){.statgrid{grid-template-columns:1fr 1fr}}.stat{background:#f7faf8;padding:14px;border-radius:12px}.stat b{display:block;font-size:24px}.ok{background:#edf8f2;border:1px solid #cfe4d8;padding:12px;border-radius:12px}.warn{background:var(--warn);border:1px solid #eedcae;padding:12px;border-radius:12px}.tag{display:inline-block;padding:4px 8px;border-radius:999px;background:var(--soft);color:var(--a);font-size:12px;margin:2px}.reason button{font-size:12px;padding:8px 10px}a{color:var(--a)}
</style>
</head>
<body>
<div class="wrap">
<div class="hero"><h1>社工師國考｜110–115 歷屆真題備考</h1><div class="muted">📱手機／💻電腦皆可｜只要有網路即可刷題｜排除國文與社會工作管理</div></div>
<div id="status" class="card warn">正在載入正式題庫……</div>
<section id="home" class="card hidden"><h2>開始刷題</h2><div class="grid">
<div><label>年度</label><select id="year"><option value="all">全部年度</option><option>115</option><option>114</option><option>113</option><option>112</option><option>111</option><option>110</option></select></div>
<div><label>科目</label><select id="subject"><option value="all">全部五科</option><option>社會工作</option><option>社會工作直接服務</option><option>社會政策與社會立法</option><option>人類行為與社會環境</option><option>社會工作研究方法</option></select></div>
<div><label>題數</label><select id="count"><option>10</option><option>20</option><option>30</option><option>40</option><option value="full">完整考一遍</option></select></div></div>
<p id="pool" class="muted"></p><div class="actions"><button onclick="startQuiz()">開始測驗</button><button class="secondary" onclick="showWeak()">🎯 個人加強區</button><button class="secondary" onclick="showStats()">📊 成績統計</button></div>
<p class="meta">作答紀錄、不確定標記與錯題次數儲存在目前裝置的瀏覽器，不需要註冊。</p></section>
<section id="quiz" class="card hidden"><div><b id="qno"></b> <span id="timer" class="meta"></span></div><div class="bar"><div id="prog"></div></div><h2 id="qtext"></h2><div id="opts"></div><div class="actions" id="navActions"></div></section>
<section id="result" class="card hidden"></section><section id="review" class="card hidden"></section>
</div>
<script>
let BANK=[],quiz=[],cur=0,ans={},uncertain={},lastWrong=[],lastUncertain=[],startedAt=0,timerId=null;
const $=id=>document.getElementById(id);const mind={"社會工作":["人在情境中","生態系統觀點","個人 ↔ 環境","家庭／組織／社區","整體性評估"],"社會工作直接服務":["專業關係","接納","同理","合作目標"],"社會政策與社會立法":["福利政策","資源分配","公平／正義","制度設計"],"人類行為與社會環境":["發展階段","心理社會發展","人在情境中","環境脈絡"],"社會工作研究方法":["信度","一致性","穩定性","效度","測量"]};
function load(k,d){try{return JSON.parse(localStorage.getItem("sw_"+k)||"null")??d}catch{return d}}function save(k,v){localStorage.setItem("sw_"+k,JSON.stringify(v))}
function filter(){const y=$("year").value,s=$("subject").value;return BANK.filter(x=>(y==="all"||String(x.year)===y)&&(s==="all"||x.subject===s))}function updatePool(){if($("pool"))$("pool").textContent=`目前篩選：${filter().length.toLocaleString()} 題｜完整考一遍＝此篩選條件全部題目`}
$("year").onchange=$("subject").onchange=updatePool;
async function init(){const status=$("status");try{const r=await fetch("data/bank.json?v="+Date.now(),{cache:"no-store"});if(!r.ok)throw Error("not-ready");const d=await r.json();BANK=d.questions||[];if(BANK.length<1000)throw Error("empty");const m=d.meta||{};status.className="card ok";status.innerHTML=`<b>✓ 正式歷屆題庫已載入</b><br>110–115 年｜五科｜共 <b>${BANK.length.toLocaleString()}</b> 題選擇題<br><span class="meta">共 ${m.papers_selected||"-"} 份試卷｜來源題庫已完成建置</span>`;$("home").classList.remove("hidden");updatePool()}catch(e){status.className="card warn";status.innerHTML="<b>題庫正在建置／更新中</b><br>若你已能進入測驗，代表題庫已可用；重新整理頁面即可更新狀態。"}}
function startQuiz(){const p=filter();if(!p.length)return alert("沒有符合條件的題目");const n=$("count").value==="full"?p.length:Number($("count").value);quiz=[...p].sort(()=>Math.random()-.5).slice(0,Math.min(n,p.length));cur=0;ans={};uncertain={};lastWrong=[];lastUncertain=[];startedAt=Date.now();clearInterval(timerId);timerId=setInterval(updateTimer,1000);$("home").classList.add("hidden");$("result").classList.add("hidden");$("review").classList.add("hidden");$("quiz").classList.remove("hidden");render();updateTimer()}
function updateTimer(){const s=Math.floor((Date.now()-startedAt)/1000);$("timer").textContent=`｜作答時間 ${String(Math.floor(s/60)).padStart(2,"0")}:${String(s%60).padStart(2,"0")}`}
function render(){const x=quiz[cur],marked=!!uncertain[x.id],last=cur===quiz.length-1;$("qno").textContent=`第 ${cur+1}／${quiz.length} 題｜${x.year}｜${x.subject}｜第 ${x.number} 題`;
$("qtext").textContent=x.question;$("prog").style.width=((cur+1)/quiz.length*100)+"%";$("opts").innerHTML=x.choices.map((o,i)=>`<button class="option ${ans[x.id]===i?"sel":""}" onclick="choose(${i})">${String.fromCharCode(65+i)}. ${o}</button>`).join("");$("navActions").innerHTML=`<button class="secondary" onclick="prevQ()" ${cur===0?"disabled":""}>上一題</button><button class="secondary" onclick="nextQ()" ${last?"disabled":""}>下一題</button><button class="uncertain ${marked?"on":""}" onclick="toggleUncertain()">${marked?"✓ 已標記不確定":"⚑ 不確定"}</button>${last?'<button class="danger" onclick="submitQuiz()">交卷</button>':""}`}
function choose(i){ans[quiz[cur].id]=i;render()}function toggleUncertain(){const id=quiz[cur].id;if(uncertain[id])delete uncertain[id];else uncertain[id]=true;render()}function nextQ(){if(cur<quiz.length-1){cur++;render()}}function prevQ(){if(cur>0){cur--;render()}}
function submitQuiz(){if(!confirm("確定交卷？"))return;clearInterval(timerId);const st=load("stats",{attempts:[],questions:{}});let correct=0;lastWrong=[];lastUncertain=[];quiz.forEach(x=>{const a=ans[x.id],marked=!!uncertain[x.id],q=st.questions[x.id]||{wrong:0,right:0,total:0,uncertain:0,reasons:{}};q.total++;if(marked)q.uncertain=(q.uncertain||0)+1;if(a===x.answer){correct++;q.right++}else{q.wrong++;lastWrong.push({x,a})}if(marked)lastUncertain.push({x,a});st.questions[x.id]=q});const score=Math.round(correct/quiz.length*100);st.attempts.unshift({at:new Date().toISOString(),score,correct,total:quiz.length,uncertain:lastUncertain.length});st.attempts=st.attempts.slice(0,100);save("stats",st);$("quiz").classList.add("hidden");$("result").classList.remove("hidden");$("result").innerHTML=`<h2>本次成績</h2><div class="statgrid"><div class="stat"><small>分數</small><b>${score}</b></div><div class="stat"><small>答對</small><b>${correct}</b></div><div class="stat"><small>答錯</small><b>${quiz.length-correct}</b></div><div class="stat"><small>不確定</small><b>${lastUncertain.length}</b></div></div><p class="muted">⚑「不確定」不影響對錯判定，只會留下學習紀錄。</p><div class="actions"><button onclick="showReview()">檢討錯題</button><button class="secondary" onclick="goHome()">回首頁</button></div>`;showReview()}
function esc(s){return String(s??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#39;")}
function reason(id,r){const st=load("stats",{attempts:[],questions:{}}),q=st.questions[id]||{wrong:0,right:0,total:0,uncertain:0,reasons:{}};q.reasons[r]=(q.reasons[r]||0)+1;st.questions[id]=q;save("stats",st);const el=document.getElementById("r_"+CSS.escape(id));if(el)el.textContent=`已記錄：${r}`}
function showReview(){$("result").classList.add("hidden");$("review").classList.remove("hidden");$("review").innerHTML="<h2>錯題檢討</h2>"+(lastWrong.length?lastWrong.map(({x,a})=>{const q=load("stats",{attempts:[],questions:{}}).questions[x.id]||{},flagged=lastUncertain.some(z=>z.x.id===x.id);return `<div class="wrong"><b>${x.year}｜${x.subject}｜第 ${x.number} 題</b>${flagged?'<span class="tag">⚑ 曾標記不確定</span>':""}<p>${esc(x.question)}</p><p>你的答案：${a==null?"未作答":String.fromCharCode(65+a)}｜正確答案：<b>${String.fromCharCode(65+x.answer)}</b></p><div class="explain"><b>解析</b><br>${esc(x.explanation||"本題解析請以題庫來源提供的解析為準。")}<br><span class="meta"><a href="${x.source||"#"}" target="_blank" rel="noopener">原始題目</a></span></div><div class="reason actions">${["完全不會","觀念混淆","選項搞混","看錯題目","粗心／判斷失誤","法規／年份記錯"].map(r=>`<button class="secondary" onclick="reason('${esc(x.id)}','${esc(r)}')">${r}</button>`).join("")}</div><small id="r_${esc(x.id)}"></small><div class="actions"><button class="secondary" onclick="toggleMind(this,'${esc(x.subject)}')">🧠 關鍵字心智擴散</button></div><div class="mind"></div><p class="meta">本題累計錯誤：${q.wrong||0} 次｜曾標記不確定：${q.uncertain||0} 次</p></div>`}).join(""):"<p>本次沒有錯題。</p>")}
function toggleMind(btn,s){const m=btn.parentElement.nextElementSibling,a=mind[s]||["核心關鍵字","核心概念","相關概念"];m.className="mind show";m.innerHTML='<div class="chain">'+a.map((x,i)=>(i?'<span class="arrow">→</span>':"")+`<span class="node">${x}</span>`).join("")+"</div><p class=\"muted\">看到關鍵字 → 先想到核心概念 → 再向相關概念擴散。</p>"}
function isWeak(v){return (v.wrong||0)>=3||((v.uncertain||0)>0&&(v.wrong||0)>=2)}
function showWeak(){const st=load("stats",{attempts:[],questions:{}}),ids=Object.entries(st.questions).filter(([,v])=>isWeak(v));$("review").classList.remove("hidden");$("result").classList.add("hidden");$("review").innerHTML=`<h2>🎯 個人加強區</h2><p>符合條件：①同一題錯 3 次以上；或 ②曾標記不確定且錯 2 次以上。</p><p>目前共 <b>${ids.length}</b> 題</p>`+(ids.length?ids.map(([id,v])=>{const x=BANK.find(q=>q.id===id);if(!x)return"";const why=v.wrong>=3?"🔴 錯 3 次以上":"⚑ 不確定後仍錯 2 次以上";return `<div class="wrong"><b>${x.year}｜${x.subject}｜第 ${x.number} 題</b><span class="tag">${why}</span><p>${esc(x.question)}</p><p class="meta">錯誤 ${v.wrong||0} 次｜答對 ${v.right||0} 次｜曾標記不確定 ${v.uncertain||0} 次</p></div>`}).join(""):"<p>目前還沒有符合條件的題目。</p>")}
function showStats(){const st=load("stats",{attempts:[],questions:{}}),v=Object.values(st.questions),t=v.reduce((a,x)=>a+(x.total||0),0),r=v.reduce((a,x)=>a+(x.right||0),0),u=v.reduce((a,x)=>a+(x.uncertain||0),0),w=v.filter(isWeak).length;$("review").classList.remove("hidden");$("result").classList.add("hidden");$("review").innerHTML=`<h2>📊 成績統計</h2><div class="statgrid"><div class="stat"><small>累計作答</small><b>${t}</b></div><div class="stat"><small>答對</small><b>${r}</b></div><div class="stat"><small>正確率</small><b>${t?Math.round(r/t*100):0}%</b></div><div class="stat"><small>個人加強</small><b>${w}</b></div></div><p>⚑ 累計不確定標記：<b>${u}</b> 次</p><h3>最近測驗</h3>${st.attempts.slice(0,10).map(a=>`<p>${new Date(a.at).toLocaleString()}｜${a.score} 分｜${a.correct}/${a.total}｜不確定 ${a.uncertain||0}</p>`).join("")||"<p>尚無紀錄。</p>"}`}
function goHome(){$("result").classList.add("hidden");$("review").classList.add("hidden");$("home").classList.remove("hidden");updatePool()}
init();
</script></body></html>
